<!DOCTYPE html>

<meta charset="UTF-8">

<title>Para ti 🌼</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #fffde7, #fff3b0, #ffe082);
}

/* =========================
   PANTALLA INICIAL
========================= */

.inicio {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;

    background:
        radial-gradient(circle at center, #fffde7 0%, #ffe082 100%);

    transition: opacity 1.5s ease;
}

.contenido-inicio {
    padding: 30px;
    animation: aparecer 2s ease;
}

.contenido-inicio .flor-icono {
    font-size: 80px;
    animation: flotar 3s ease-in-out infinite;
}

.contenido-inicio h1 {
    color: #8d6e00;
    font-size: 32px;
    margin: 15px 0 10px;
}

.contenido-inicio p {
    color: #6d5710;
    font-size: 18px;
    margin-bottom: 30px;
}

.boton {
    border: none;
    padding: 15px 30px;
    border-radius: 30px;

    background: linear-gradient(135deg, #ffd600, #ffb300);
    color: white;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 8px 20px rgba(180, 130, 0, .25);

    transition: transform .3s, box-shadow .3s;
}

.boton:hover {
    transform: scale(1.08);
    box-shadow: 0 12px 25px rgba(180, 130, 0, .35);
}

/* =========================
   ESCENA
========================= */

.escena {
    position: relative;
    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    opacity: 0;
    transition: opacity 2s ease;
}

.escena.activa {
    opacity: 1;
}

/* =========================
   ESTRELLAS / BRILLOS
========================= */

.brillo {
    position: absolute;
    width: 7px;
    height: 7px;

    background: white;
    border-radius: 50%;

    box-shadow: 0 0 12px white;

    animation: brillo 2.5s infinite ease-in-out;
}

.b1 { left: 10%; top: 15%; }
.b2 { left: 80%; top: 20%; animation-delay: .5s; }
.b3 { left: 20%; top: 70%; animation-delay: 1s; }
.b4 { left: 90%; top: 65%; animation-delay: 1.5s; }
.b5 { left: 50%; top: 10%; animation-delay: .8s; }
.b6 { left: 65%; top: 75%; animation-delay: 1.2s; }

/* =========================
   RAMO
========================= */

.ramo {
    position: relative;

    width: 360px;
    height: 560px;

    transform: translateY(40px);

    animation: aparecerRamo 2s ease forwards;
}

/* =========================
   TALLOS
========================= */

.tallo {
    position: absolute;

    bottom: 95px;
    left: 50%;

    width: 8px;
    height: 350px;

    background: linear-gradient(
        to right,
        #236b2b,
        #4caf50,
        #236b2b
    );

    border-radius: 10px;

    transform-origin: bottom;
}

.t1 { transform: rotate(-32deg); }
.t2 { transform: rotate(-22deg); }
.t3 { transform: rotate(-11deg); }
.t4 { transform: rotate(0deg); }
.t5 { transform: rotate(12deg); }
.t6 { transform: rotate(24deg); }
.t7 { transform: rotate(34deg); }

/* =========================
   FLORES
========================= */

.flor {
    position: absolute;

    width: 125px;
    height: 125px;

    transform: scale(0);

    animation: aparecerFlor 1.5s ease forwards,
               balanceo 4s ease-in-out infinite;

    transform-origin: bottom center;
}

.flor1 {
    left: 0;
    top: 45px;
    animation-delay: .5s, 2s;
}

.flor2 {
    left: 65px;
    top: 0;
    animation-delay: .9s, 2.2s;
}

.flor3 {
    left: 130px;
    top: 55px;
    animation-delay: 1.3s, 2.4s;
}

.flor4 {
    left: 190px;
    top: 5px;
    animation-delay: 1.7s, 2.6s;
}

.flor5 {
    left: 220px;
    top: 75px;
    animation-delay: 2.1s, 2.8s;
}

.flor6 {
    left: 80px;
    top: 110px;
    animation-delay: 2.5s, 3s;
}

.flor7 {
    left: 150px;
    top: 130px;
    animation-delay: 2.9s, 3.2s;
}

/* =========================
   PÉTALOS
========================= */

.petalo {
    position: absolute;

    width: 38px;
    height: 62px;

    left: 44px;
    top: 0;

    background: linear-gradient(
        to bottom,
        #fff176,
        #ffd600
    );

    border-radius: 50%;

    transform-origin: 19px 62px;

}

.p1 { transform: rotate(0deg); }
.p2 { transform: rotate(45deg); }
.p3 { transform: rotate(90deg); }
.p4 { transform: rotate(135deg); }
.p5 { transform: rotate(180deg); }
.p6 { transform: rotate(225deg); }
.p7 { transform: rotate(270deg); }
.p8 { transform: rotate(315deg); }

/* =========================
   CENTRO
========================= */

.centro {
    position: absolute;

    width: 48px;
    height: 48px;

    left: 39px;
    top: 39px;

    border-radius: 50%;

    background:

            #e6a900 100%

    z-index: 5;

}

/* =========================
   HOJAS
========================= */

.hoja {

    height: 35px;

.h1 {

}

.h2 {

.h4 {

/* =========================

========================= */

.envoltura {

    left: 50%;

    width: 275px;
    height: 190px;

    background:

        90% 0,
        100% 100%,
        0 100%

    box-shadow:

}

.papel {
    position: absolute;

    bottom: 35px;
    left: 50%;

    transform: translateX(-50%);

    width: 240px;
    height: 150px;

        85% 0,
        100% 100%,
        0 100%
    );

}

/* =========================
   MOÑO
========================= */

.mono {
    position: absolute;

    bottom: 110px;
    left: 50%;

    transform: translateX(-50%);

    width: 110px;
    height: 65px;

    z-index: 20;
}

.lazo {
    position: absolute;

    width: 58px;
    height: 45px;

    background: #e91e63;

    border-radius: 50%;

    top: 5px;
}

.lazo.izq {
    left: 0;
    transform: rotate(25deg);
}

.lazo.der {
    right: 0;
    transform: rotate(-25deg);
}

.nudo {
    position: absolute;

    left: 42px;
    top: 14px;

    width: 28px;
    height: 28px;

    background: #c2185b;

    border-radius: 50%;

    z-index: 5;
}

/* =========================
   MENSAJE
========================= */

.mensaje {
    position: absolute;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    width: 90%;

    text-align: center;

    color: #795548;

    opacity: 0;

    animation: aparecerMensaje 2s ease 4s forwards;
}

.mensaje h2 {
    margin: 0;

    font-size: 28px;

    color: #8d6e00;
}

.mensaje p {
    margin-top: 8px;

    font-size: 17px;

    color: #6d5710;
}

/* =========================
   PÉTALOS CAYENDO
========================= */

.petalo-caida {
    position: fixed;

    top: -20px;

    width: 12px;
    height: 18px;

    background: #ffd600;

    border-radius: 100% 0 100% 0;

    animation: caer linear forwards;

    z-index: 50;
}

/* =========================
   ANIMACIONES
========================= */

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes aparecerRamo {
    from {
        opacity: 0;
        transform: translateY(100px) scale(.8);
    }

    to {
        opacity: 1;
        transform: translateY(40px) scale(1);
    }
}

@keyframes aparecerFlor {

    0% {
        transform: scale(0);
    }

    70% {
        transform: scale(1.15);
    }

    100% {
        transform: scale(1);
    }
}

@keyframes balanceo {

    0%,100% {
        rotate: -2deg;
    }

    50% {
        rotate: 2deg;
    }
}

@keyframes flotar {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-15px);
    }
}

@keyframes brillo {

    0%,100% {
        opacity: .2;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }
}

@keyframes aparecerMensaje {

    from {
        opacity: 0;
        transform: translate(-50%,20px);
    }

    to {
        opacity: 1;
        transform: translate(-50%,0);
    }
}

@keyframes caer {

    from {
        transform:
            translateY(-20px)
            rotate(0deg);
    }

    to {
        transform:
            translateY(110vh)
            rotate(720deg);
    }
}

/* =========================
   CELULAR
========================= */

@media(max-width: 600px) {

    .ramo {
        transform: scale(.78) translateY(50px);
    }

    .mensaje h2 {
        font-size: 23px;
    }

    .mensaje p {
        font-size: 15px;
    }

    .contenido-inicio h1 {
        font-size: 26px;
    }
}

</style>
</head>

<script>

/* =========================
   ABRIR REGALO
========================= */

function abrirRegalo() {

    const inicio = document.getElementById("inicio");
    const escena = document.getElementById("escena");

    inicio.style.opacity = "0";

    setTimeout(() => {

        inicio.style.display = "none";

        escena.classList.add("activa");

        crearPetalos();

    }, 1200);
}


/* =========================
   PÉTALOS
========================= */

function crearPetalos() {

    for(let i = 0; i < 35; i++) {

        setTimeout(() => {

            const petalo =
                document.createElement("div");

            petalo.classList.add("petalo-caida");

            petalo.style.left =
                Math.random() * 100 + "vw";

            petalo.style.animationDuration =
                (4 + Math.random() * 5) + "s";

            petalo.style.opacity =
                0.5 + Math.random() * 0.5;

            petalo.style.transform =
                `rotate(${Math.random() * 360}deg)`;

            document.body.appendChild(petalo);


            setTimeout(() => {

                petalo.remove();

            }, 10000);

        }, i * 250);

    }

}

</script>
