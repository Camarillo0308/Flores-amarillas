<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramo de Flores Amarillas 🌼</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(to bottom, #fff8dc, #ffe082);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    .contenedor {
        position: relative;
        width: 600px;
        height: 700px;
    }

    /* Fondo */
    .brillo {
        position: absolute;
        width: 10px;
        height: 10px;
        background: #fff;
        border-radius: 50%;
        opacity: .7;
        animation: flotar 4s infinite ease-in-out;
    }

    .b1 { left: 10%; top: 20%; animation-delay: .2s; }
    .b2 { left: 80%; top: 15%; animation-delay: 1s; }
    .b3 { left: 20%; top: 55%; animation-delay: 2s; }
    .b4 { left: 90%; top: 60%; animation-delay: 1.5s; }

    /* Ramo */
    .ramo {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        width: 330px;
        height: 480px;
    }

    /* Tallos */
    .tallo {
        position: absolute;
        bottom: 90px;
        left: 50%;
        width: 9px;
        height: 350px;
        background: linear-gradient(to right, #287a35, #4caf50);
        border-radius: 10px;
        transform-origin: bottom;
    }

    .t1 { transform: rotate(-28deg); }
    .t2 { transform: rotate(-18deg); }
    .t3 { transform: rotate(-8deg); }
    .t4 { transform: rotate(7deg); }
    .t5 { transform: rotate(18deg); }
    .t6 { transform: rotate(29deg); }

    /* Flores */
    .flor {
        position: absolute;
        width: 130px;
        height: 130px;
        animation: balanceo 3s infinite ease-in-out;
        transform-origin: bottom center;
    }

    .flor1 { left: 5px; top: 35px; animation-delay: .2s; }
    .flor2 { left: 65px; top: 0; animation-delay: .5s; }
    .flor3 { left: 105px; top: 55px; animation-delay: .8s; }
    .flor4 { left: 165px; top: 10px; animation-delay: 1.1s; }
    .flor5 { left: 200px; top: 70px; animation-delay: .4s; }
    .flor6 { left: 85px; top: 110px; animation-delay: 1.3s; }

    /* Pétalos */
    .petalo {
        position: absolute;
        width: 42px;
        height: 65px;
        background: linear-gradient(#fff176, #ffd600);
        border-radius: 50%;
        left: 44px;
        top: 0;
        transform-origin: 21px 65px;
        box-shadow: 0 2px 5px rgba(0,0,0,.12);
    }

    .p1 { transform: rotate(0deg); }
    .p2 { transform: rotate(45deg); }
    .p3 { transform: rotate(90deg); }
    .p4 { transform: rotate(135deg); }
    .p5 { transform: rotate(180deg); }
    .p6 { transform: rotate(225deg); }
    .p7 { transform: rotate(270deg); }
    .p8 { transform: rotate(315deg); }

    /* Centro de margarita */
    .centro {
        position: absolute;
        width: 48px;
        height: 48px;
        background: radial-gradient(circle, #ffec5c, #e6a900);
        border-radius: 50%;
        left: 41px;
        top: 41px;
        z-index: 5;
        box-shadow: inset 0 3px 5px rgba(0,0,0,.2);
    }

    /* Hojas */
    .hoja {
        position: absolute;
        width: 80px;
        height: 35px;
        background: linear-gradient(135deg, #388e3c, #7cb342);
        border-radius: 100% 0 100% 0;
    }

    .h1 {
        bottom: 250px;
        left: 25px;
        transform: rotate(-35deg);
    }

    .h2 {
        bottom: 210px;
        right: 20px;
        transform: rotate(140deg);
    }

    .h3 {
        bottom: 165px;
        left: 40px;
        transform: rotate(-20deg);
    }

    .h4 {
        bottom: 130px;
        right: 35px;
        transform: rotate(150deg);
    }

    /* Envoltura */
    .envoltura {
        position: absolute;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        height: 190px;
        background: linear-gradient(135deg, #fffde7, #fff59d);
        clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%);
        z-index: 10;
        box-shadow: 0 5px 15px rgba(0,0,0,.15);
    }

    /* Papel interior */
    .papel {
        position: absolute;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        width: 230px;
        height: 150px;
        background: rgba(255,255,255,.6);
        clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%);
        z-index: 11;
    }

    /* Moño */
    .moco {
        position: absolute;
        bottom: 115px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 60px;
        z-index: 20;
    }

    .lazo {
        position: absolute;
        width: 55px;
        height: 45px;
        background: #e91e63;
        border-radius: 50%;
        top: 5px;
    }

    .lazo.izq {
        left: 0;
        transform: rotate(25deg);
    }

    .lazo.der {
        right: 0;
        transform: rotate(-25deg);
    }

    .nudo {
        position: absolute;
        left: 38px;
        top: 15px;
        width: 25px;
        height: 25px;
        background: #c2185b;
        border-radius: 50%;
        z-index: 3;
    }

    /* Texto */
    .mensaje {
        position: absolute;
        bottom: 5px;
        width: 100%;
        text-align: center;
        color: #8d6e00;
        font-size: 25px;
        font-weight: bold;
        text-shadow: 1px 1px white;
    }

    @keyframes balanceo {
        0%, 100% {
            transform: rotate(-2deg);
        }
        50% {
            transform: rotate(2deg);
        }
    }

    @keyframes flotar {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-20px);
        }
    }
</style>
</head>

<body>

<div class="contenedor">

    <div class="brillo b1"></div>
    <div class="brillo b2"></div>
    <div class="brillo b3"></div>
    <div class="brillo b4"></div>

    <div class="ramo">

        <!-- Tallos -->
        <div class="tallo t1"></div>
        <div class="tallo t2"></div>
        <div class="tallo t3"></div>
        <div class="tallo t4"></div>
        <div class="tallo t5"></div>
        <div class="tallo t6"></div>

        <!-- Hojas -->
        <div class="hoja h1"></div>
        <div class="hoja h2"></div>
        <div class="hoja h3"></div>
        <div class="hoja h4"></div>

        <!-- FLORES -->

        <div class="flor flor1">
            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="petalo p7"></div>
            <div class="petalo p8"></div>
            <div class="centro"></div>
        </div>

        <div class="flor flor2">
            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="petalo p7"></div>
            <div class="petalo p8"></div>
            <div class="centro"></div>
        </div>

        <div class="flor flor3">
            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="petalo p7"></div>
            <div class="petalo p8"></div>
            <div class="centro"></div>
        </div>

        <div class="flor flor4">
            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="petalo p7"></div>
            <div class="petalo p8"></div>
            <div class="centro"></div>
        </div>

        <div class="flor flor5">
            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="petalo p7"></div>
            <div class="petalo p8"></div>
            <div class="centro"></div>
        </div>

        <div class="flor flor6">
            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="petalo p7"></div>
            <div class="petalo p8"></div>
            <div class="centro"></div>
        </div>

        <!-- Envoltura -->
        <div class="envoltura"></div>
        <div class="papel"></div>

        <!-- Moño -->
        <div class="moco">
            <div class="lazo izq"></div>
            <div class="lazo der"></div>
            <div class="nudo"></div>
        </div>

    </div>

    <div class="mensaje">
        🌼 Para ti, con cariño 🌼
    </div>

</div>

</body>
</html>
